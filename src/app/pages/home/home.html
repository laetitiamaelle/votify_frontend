<!-- ============================================================
     PAGE D'ACCUEIL — home.component.html
     Hero section avec titre, description et boutons CTA.
     ============================================================ -->

<section class="hero-section">
  <div class="hero-content">
    <!-- Texte principal -->
    <div class="hero-texte">
      <h1 class="hero-titre">Votez simplement, rapidement et en <span class="hero-accent">toute sécurité</span></h1>
      <p class="hero-sous-titre">
        La solution de vote électronique nouvelle génération conçue spécifiquement pour les universités, les associations et les organisations soucieuses de transparence.
      </p>
      <!-- Boutons d'action -->
      <div class="hero-buttons">
        <a routerLink="/register" class="btn-green">
          Commencer maintenant
          <i class="bi bi-arrow-right"></i>
        </a>
        <a routerLink="/login" class="btn-secondary">Se connecter</a>
      </div>
    </div>
    <!-- Image ou illustration -->
    <div class="hero-visuel">
      <img src="assets/images/hero-tablette.png" alt="Tablette affichant l'application Votify" class="img-fluid">
    </div>
  </div>
</section>
